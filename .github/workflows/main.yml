name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "既存リリースに作り直した exe / zip を添付するタグ（例: v3.0.0）。空ならビルド確認のみ"
        required: false
        default: ""

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"
  # タグ push ならそのタグ、手動実行ならタグの入力値（空ならリリースしない）
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.sha }}
          submodules: recursive

      # zip に同梱する README.txt はワークフローと同じコミットから取る
      # （手動実行で過去のタグをビルドするとき、そのタグに README.txt が無くても同梱できるように）
      - name: Checkout packaging files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: _packaging
          sparse-checkout: build/release

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build -platform windows/amd64

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "${{ github.sha }}".Substring(0, 7) }
          $name = "VRCLogBridge-$version"
          $dir = "build/package/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/bin/VRCLogBridge.exe $dir
          Copy-Item _packaging/build/release/README.txt $dir
          Copy-Item LICENSE $dir
          Copy-Item frontend/src/assets/fonts/OFL.txt $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "build/package/$name.zip"
          "zip=build/package/$name.zip" >> $env:GITHUB_OUTPUT

      - name: Upload artifact for verification
        if: ${{ env.RELEASE_TAG == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VRCLogBridge-windows-amd64-${{ github.sha }}
          path: |
            build/bin/VRCLogBridge.exe
            ${{ steps.package.outputs.zip }}
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ env.RELEASE_TAG != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/bin/VRCLogBridge.exe
            ${{ steps.package.outputs.zip }}
          draft: false
          prerelease: false
          # 手動実行で既存リリースに添付するときは、リリースノートを作り直さない
          generate_release_notes: ${{ github.event_name == 'push' }}
