[tools]
go = "1.22.2"
node = "24.1.0"
pnpm = "9.15.9"

[tasks.dev]
description = "Run Wails in development mode"
run = "wails dev"

[tasks.build]
description = "Build Wails application"
run = "wails build"

[tasks."build:prod"]
description = "Build Wails application for production"
run = "wails build -clean"

[tasks."update-wails"]
description = "Update Wails CLI to latest version"
run = "go install github.com/wailsapp/wails/v2/cmd/wails@latest"

[tasks.doctor]
description = "Check development environment setup"
run = "wails doctor"

[tasks.version]
description = "Show Wails version"
run = "wails version"

[tasks.fmt]
description = "Format frontend (Biome) and Go (gofmt)"
run = [
  "pnpm --dir frontend run format",
  "gofmt -w main.go app.go internal",
]

[tasks.lint]
description = "Check format and lint (Biome, svelte-check, gofmt, go vet)"
run = [
  "pnpm --dir frontend run lint",
  "gofmt -l main.go app.go internal",
  "go vet ./...",
]
